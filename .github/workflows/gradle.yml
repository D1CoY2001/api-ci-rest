name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Start SUT in background
        run: java -jar ./artifacts/app-mbank.jar > sut.log 2>&1 &
        shell: bash

      - name: Wait for SUT to be ready
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/localhost/9999) 2>/dev/null; then
              exec 3>&- 3<&-
              echo "SUT is up on port 9999"
              exit 0
            fi
            echo "Waiting for SUT... attempt $i"
            sleep 1
          done
          echo "SUT did not start within 30 seconds"
          cat sut.log || true
          exit 1

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests
            build/test-results

      - name: Upload SUT log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sut-log
          path: sut.log